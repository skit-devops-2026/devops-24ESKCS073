services:
  billbook:
    image: atharvasharmaa/billbook:latest
    build: .
    container_name: billbook
    ports:
      - "8081:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: billbook-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: billbook-nginx-exporter
    command:
      - "--nginx.scrape-uri=http://billbook/nginx_status"
    ports:
      - "9113:9113"
    depends_on:
      - billbook
    restart: unless-stopped
